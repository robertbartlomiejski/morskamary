name: Full Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full analysis pipeline
        env:
          # This workflow verifies deterministic committed static artifacts;
          # full-live-analysis.yml is the only workflow that runs live enrichment.
          ALLOW_STATIC_RECOVERY_MODE: "true"
          STATIC_RECOVERY_REASON: "Full Analysis CI reproducibility check"
        run: python run_full_analysis.py --analysis-input-mode static

      - name: Verify output artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "outputs/report_index.html"
            "outputs/gaps_by_sector.html"
            "outputs/credentials_matrix.html"
            "outputs/literature_integration.html"
            "outputs/competences_full_database.json"
            "outputs/credentials_database.json"
            "outputs/sector_pathways.json"
            "outputs/gaps_summary.csv"
          )
          for f in "${expected[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing expected output: $f"
              exit 1
            fi
            echo "✓ $f"
          done
          sector_dir="outputs/sector_dictionaries"
          if [[ ! -d "$sector_dir" ]]; then
            echo "Missing expected output directory: $sector_dir"
            exit 1
          fi
          sector_count="$(find "$sector_dir" -maxdepth 1 -type f -name '*_tmbd_dictionary.json' | wc -l | tr -d ' ')"
          if [[ "$sector_count" -ne 12 ]]; then
            echo "Expected 12 sector dictionary files, found: $sector_count"
            exit 1
          fi
          echo "✓ $sector_dir ($sector_count files)"
          echo "All output artifacts verified, including sector dictionaries."

      - name: Validate generated output semantics
        run: python scripts/validate_generated_outputs.py

      - name: Check static outputs are reproducible in isolation
        shell: bash
        env:
          STATIC_COMPARE_ROOT: /tmp/full-analysis-static-baseline
        run: |
          set -euo pipefail
          rm -rf "$STATIC_COMPARE_ROOT"
          mkdir -p "$STATIC_COMPARE_ROOT"
          cp -R outputs/. "$STATIC_COMPARE_ROOT/"
          python run_full_analysis.py --analysis-input-mode static
          python scripts/compare_generated_outputs.py \
            --root outputs \
            --baseline-root "$STATIC_COMPARE_ROOT"

      - name: Upload analysis outputs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Morskamary_QMBD_Audit_Run_${{ github.run_id }}
          path: |
            outputs/
            data/derived/
          retention-days: 30
