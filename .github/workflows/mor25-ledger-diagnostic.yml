name: MOR-25 protected ledger read
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: live-research
    concurrency: mor25-openalex-port-pilot-v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "psycopg[binary]==3.3.9"
      - run: python -m unittest discover -s tests -p test_mor25_ledger_diagnostic.py
      - name: Read approved authorization
        env:
          ATTEMPT_LEDGER_DSN: ${{ secrets.LIVE_ATTEMPT_LEDGER_RUNTIME_DSN }}
        run: python -m scripts.mor25_ledger_diagnostic
