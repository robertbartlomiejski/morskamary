name: PR270 consolidated remediation

on:
  push:
    branches:
      - codex/pr270-consolidated-fix-work

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
