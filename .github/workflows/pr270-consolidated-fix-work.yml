          # 5) Method note: keep the supplied tourism aggregate outside repository evidence.
          path = 'docs/PERFORMATIVE_DEMAND_CROSS_AXIS_METHOD.md'
          p = ROOT / path
          text = p.read_text(encoding='utf-8')
          note = '''\n\n## Review reconciliation: output identity and provenance\n\nAll axis-bearing publication tables retain both the canonical `axis_group` and its non-inferred display `axis_code` (`M`, `T`, `O`, `H`). Screening rows carry the actual retained `evidence_surface` derived from `semantic_scope`; they are not assumed to be title-only. The supplied 21-fragment coastal-tourism 4 × 4 recoding remains comparison data, explicitly marked `citation_needed`, because no retained citable source for that aggregate exists in the repository. It is not repository evidence and cannot establish validated translation or performativity.\n'''
          if '## Review reconciliation: output identity and provenance' not in text:
