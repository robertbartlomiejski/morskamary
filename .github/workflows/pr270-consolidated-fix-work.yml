              '''    for axis in AXES:\n        group = all_linked.loc[all_linked["axis_group"].eq(axis)]\n        evidence_surface = _evidence_surface(group)\n        for feature in PERFORMATIVE_FEATURE_SIGNAL_TYPES:\n''',
